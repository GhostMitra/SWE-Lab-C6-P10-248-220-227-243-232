# Enhanced for SWE Lab IEM Admission Portal
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm install
          cd ../frontend && npm install

      - name: Run Automated Test Plan (PCCCS594 TC-S01 to TC-S07)
        run: |
          npm test

      - name: Build Angular Production Distribution
        run: |
          npm run build

      - name: Deploy to Firebase Hosting (Live Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEM_ADMISSION_404BN }}
          channelId: live
          projectId: iem-admission-404bn
