# Auto-generated by Firebase CLI & Enhanced for SWE Lab IEM Admission Portal
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm install
          cd ../frontend && npm install

      - name: Run Automated Test Plan (PCCCS594 TC-S01 to TC-S07)
        run: |
          npm test

      - name: Build Angular Production Distribution
        run: |
          npm run build

      - name: Deploy to Firebase Hosting (Live Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEM_ADMISSION_404BN }}
          channelId: live
          projectId: iem-admission-404bn
        continue-on-error: true

      - name: Fallback Deployment using Firebase CLI Action
        if: env.FIREBASE_TOKEN != ''
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore,storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
