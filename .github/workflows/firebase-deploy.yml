name: Deploy to Firebase on Merge

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root & Backend Dependencies
        run: |
          npm install
          cd backend && npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm install

      - name: Run Automated Test Plan (PCCCS594 TC-S01 to TC-S07)
        run: |
          npm test

      - name: Build Angular Production Bundle
        run: |
          cd frontend && npm run build

      - name: Deploy to Firebase Hosting & Cloud Services
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEM_ADMISSION_404BN }}
          channelId: live
          projectId: iem-admission-404bn
        continue-on-error: true

      - name: Fallback Deployment using Firebase CLI Action
        if: env.FIREBASE_TOKEN != ''
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,storage,firestore
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
