# Auto-generated by Firebase CLI & Enhanced for SWE Lab IEM Admission Portal
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm install
          cd ../frontend && npm install

      - name: Run Automated Test Plan (PCCCS594 TC-S01 to TC-S07)
        run: |
          npm test

      - name: Build Angular Production Distribution
        run: |
          npm run build

      - name: Deploy Preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEM_ADMISSION_404BN }}
          projectId: iem-admission-404bn
