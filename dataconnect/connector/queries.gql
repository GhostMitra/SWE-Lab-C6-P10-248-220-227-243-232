# Queries for Firebase Data Connect (SQL Engine on PostgreSQL)

query GetOpenCourses @auth(level: PUBLIC) {
  courses(where: { isOpen: { eq: true } }) {
    courseId
    courseCode
    courseName
    degree
    durationYears
    eligibilityCriteria
    minTenthPercentage
    minTwelfthPercentage
    seats
    applicationFee
  }
}

query GetApplicantApplications($userId: Int!) @auth(level: USER) {
  applications(where: { user: { userId: { eq: $userId } } }) {
    applicationId
    status
    applicationDate
    course {
      courseCode
      courseName
      degree
    }
  }
}

query GetApplicationDossier($applicationId: String!) @auth(level: USER) {
  application(id: $applicationId) {
    applicationId
    status
    applicationDate
    reviewRemarks
    user {
      fullName
      email
      phone
    }
    course {
      courseCode
      courseName
    }
  }
}
